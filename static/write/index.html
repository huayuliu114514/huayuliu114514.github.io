<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>万束屋 · 写文章</title>
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff9ec0; --pink-soft: #ffe4ee; --ink: #4a3b42;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font: 16px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      linear-gradient(rgba(255, 250, 252, 0.42), rgba(255, 250, 252, 0.42)),
      url("/img/bg-1920.jpg") center / cover fixed no-repeat;
  }
  @media screen and (max-width: 900px) {
    body {
      background-image:
        linear-gradient(rgba(255, 250, 252, 0.46), rgba(255, 250, 252, 0.46)),
        url("/img/bg-960.jpg");
      background-attachment: scroll;
    }
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 {
    font-family: "ZCOOL KuaiLe", "YouYuan", "幼圆", sans-serif;
    font-weight: 400; letter-spacing: .05em;
    font-size: 2rem; text-align: center; margin: .4em 0 .2em;
  }
  .sub { text-align: center; color: #8d7380; margin-bottom: 1.4em; }
  .sub a { color: #d95f8e; }
  label { display: block; margin: 1.1em 0 .35em; font-weight: 600; }
  input[type=text], textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid rgba(243,207,221,.9);
    border-radius: 12px; font: inherit; color: var(--ink);
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    outline: none; transition: border-color .15s;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--pink); }
  textarea { min-height: 220px; resize: vertical; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .hint { font-size: .85rem; color: #a08490; margin-top: .3em; }
  .radio { display: flex; gap: 14px; margin-top: .4em; }
  .radio span { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .btn {
    display: block; width: 100%; margin-top: 1.8em; padding: 14px;
    border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #ff9ec0, #ff7fae);
    color: #fff; font-size: 1.15rem; font-weight: 700;
    box-shadow: 0 4px 14px rgba(255,126,174,.4);
  }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: rgba(255,255,255,.82); color: var(--pink); border: 1.5px solid var(--pink);
    box-shadow: none; margin-top: .8em; font-size: 1rem;
  }
  .note {
    margin-top: 2.2em; padding: 14px 16px; border-radius: 12px;
    background: rgba(255,255,255,.75); border: 1px dashed rgba(240,196,213,.9);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-size: .92rem;
  }
  .note b { color: #d95f8e; }
  .ok { display: none; margin-top: 1em; padding: 12px; border-radius: 12px;
        background: #eafff0; color: #2e7d4f; border: 1px solid #b8e6c8; }

  /* 樱花飘落 */
  .sakura-container { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .sakura-petal {
    position: absolute; top: -6vh;
    border-radius: 150% 0 150% 0;
    background: linear-gradient(135deg, #ffd9e6 10%, #ffb3cc 70%, #ff9ec0);
    box-shadow: inset -1px -1px 2px rgba(230,120,160,.35), inset 1px 1px 2px rgba(255,255,255,.65);
    opacity: var(--petal-opacity, 0.5);
    animation: sakura-fall linear infinite;
  }
  @keyframes sakura-fall {
    0%   { transform: translate3d(0, -8vh, 0) rotate(0deg); }
    25%  { transform: translate3d(6vw, 22vh, 0) rotate(105deg); }
    50%  { transform: translate3d(-6vw, 52vh, 0) rotate(220deg); }
    75%  { transform: translate3d(5vw, 80vh, 0) rotate(325deg); }
    100% { transform: translate3d(-4vw, 112vh, 0) rotate(430deg); }
  }
  @media (prefers-reduced-motion: reduce) { .sakura-container { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>写文章 ✍️</h1>
  <div class="sub">在手机上记下此刻的想法 · <a href="/drafts/">查看草稿箱 →</a></div>

  <label>标题</label>
  <input type="text" id="title" placeholder="比如：第一次机考复盘" />

  <div class="row">
    <div>
      <label>标签（用逗号分隔）</label>
      <input type="text" id="tags" placeholder="反思, 面试" />
    </div>
    <div>
      <label>分类</label>
      <input type="text" id="cat" placeholder="随笔" />
    </div>
  </div>

  <label>正文（支持 Markdown）</label>
  <textarea id="body" placeholder="## 今天发生了什么&#10;&#10;写点什么吧……"></textarea>

  <label>发布方式</label>
  <div class="radio">
    <span><input type="radio" name="draft" value="false" checked /> 直接发布</span>
    <span><input type="radio" name="draft" value="true" /> 先存草稿</span>
  </div>
  <div class="hint">草稿不会出现在网站上，之后可以在「草稿箱」里查看。</div>

  <button class="btn" id="go">生成并提交到 GitHub →</button>
  <button class="btn ghost" id="copy">复制 Markdown（备用）</button>
  <div class="ok" id="ok">✅ 已复制 Markdown，去 GitHub 粘贴即可</div>

  <div class="note">
    <b>怎么用：</b>点上面的粉色按钮会打开 GitHub 的新建文件页（内容已自动填好），
    确认文件名没问题后，点页面底部的绿色 <b>Commit changes</b> 就完成提交。
    第一次使用需要在浏览器里登录一次 GitHub 账号。<br><br>
    <b>草稿：</b>存为草稿的文章不会发布到网站，在 <a href="/drafts/" style="color:#d95f8e">草稿箱</a> 里可以随时查看；
    想发布时，在 GitHub 里把开头的 <code>draft: true</code> 改成 <code>false</code> 即可。
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // 樱花动画
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var c = document.createElement("div");
    c.className = "sakura-container";
    c.setAttribute("aria-hidden", "true");
    var n = window.innerWidth < 600 ? 10 : 18;
    for (var i = 0; i < n; i++) {
      var p = document.createElement("div");
      p.className = "sakura-petal";
      var size = 9 + Math.random() * 9;
      var dur = 9 + Math.random() * 9;
      p.style.left = (Math.random() * 100).toFixed(2) + "vw";
      p.style.width = size.toFixed(1) + "px";
      p.style.height = (size * 1.35).toFixed(1) + "px";
      p.style.animationDuration = dur.toFixed(1) + "s";
      p.style.animationDelay = (-Math.random() * dur).toFixed(1) + "s";
      p.style.setProperty("--petal-opacity", (0.35 + Math.random() * 0.4).toFixed(2));
      c.appendChild(p);
    }
    document.body.appendChild(c);
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function nowStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
           "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":00+08:00";
  }

  function slug(s) {
    return (s || "").replace(/[\\/:*?"<>|\s#]+/g, "-").replace(/^-+|-+$/g, "") || "未命名";
  }

  function build() {
    var title = $("title").value.trim() || "未命名";
    var tags = $("tags").value.split(/[,，]/).map(function (t) { return t.trim(); }).filter(Boolean);
    var cat = $("cat").value.trim();
    var draft = document.querySelector('input[name=draft]:checked').value;
    var body = $("body").value.trim() || "（正文待补充）";

    var fm = [
      "---",
      "title: '" + title.replace(/'/g, "''") + "'",
      "date: '" + nowStr() + "'",
      "draft: " + draft,
      "tags: [" + tags.map(function (t) { return "'" + t.replace(/'/g, "''") + "'"; }).join(", ") + "]",
      "categories: [" + (cat ? "'" + cat.replace(/'/g, "''") + "'" : "") + "]",
      "description: ''",
      "---",
      "",
      body,
      ""
    ].join("\n");

    var fname = "content/posts/" + nowStr().slice(0, 10) + "-" + nowStr().slice(11, 13) + nowStr().slice(14, 16) + "-" + slug(title) + ".md";
    return { md: fm, fname: fname };
  }

  $("go").addEventListener("click", function () {
    var r = build();
    var url = "https://github.com/huayuliu114514/huayuliu114514.github.io/new/main/?filename=" +
              encodeURIComponent(r.fname) + "&value=" + encodeURIComponent(r.md);
    window.open(url, "_blank");
  });

  $("copy").addEventListener("click", function () {
    var r = build();
    var text = r.fname + "\n\n" + r.md;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        $("ok").style.display = "block";
        setTimeout(function () { $("ok").style.display = "none"; }, 3000);
      });
    } else {
      window.prompt("复制这段内容：", text);
    }
  });
})();
</script>
</body>
</html>
